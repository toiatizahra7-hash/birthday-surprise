<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A littel surprise for saroura🩷🎀</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            margin:0%
            min-height:100vh
            padding: 25px 12px;
            display:flex;
            justify-content:center;
            font-family:georgia,serif;
            text-align:center;
            color:#596747
            background:linear-gradient(135deg,#fff0f5,#e2edcf,#fce4ec);
            overflow-x:hidden;
        }
        .card{
            background:rgba(255,255,255,0,8);
            padding:35px 25px;
            margin:20px;
            border-radius:25px;
            box-shadow:0 10px 30px #dba6c5;
            max-width:360px;
            animation:appear 1.2s ease;
        }
        h1{
            color:#e77cac
        }
        .heart{
            font-size:55px;
            animation:beat 1s infinite;
        }
        button{
            background:#ed91bd;
            color:white;
            border:none;
            padding:13px 22px;
            border-radius: 25px;
            font-size: 16px;
            cursor:pointer;
        }
        #message{
            display:none;
            margin-top:20px;
            line-height:1.7;
        }
        @keyframes appear{
            from{opacity:0; transform:translateY(20px);}
            to{opacity:1; transform:translateY(0);}
        }
        .cute-button{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:10px
            padding:14px 25px;
            background:linear-gradient(135deg,#f8c8dc,#eaa5c1);
            color:#79566a;
            text-decoration:none;
            font-family:georgia,serif;
            font-size: 16px;
            border:2px solid #fff0f6;
            border-radius: 30px;
            box-shadow:0 5px 20px #d99bb855;
            transition:background 0.3s ease;
        }
        .cute-button span{
            color:#78936b;
            font-size: 22px;
        }
        .cute-button:hover{
            transition:translateY(-4px)scale(1.04);
            background:linear-gradient(135deg,#fce1ed,#cfe5c4);
            box-shadow:0 8px 20px #a6c59b66;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">💗</div>
        <h1>A littel surprise🫶🏻🍰🧸</h1>
        <p>someone made somthing special for you...</p>
        <a href="page3.html" class="cute-button">open your gift<span>𐙚</span></a>
        <div id="message">
            <h2>happy birthday!🎂</h2>
            <p>you deserve all the happibess in the world.💋</p>
            <p>made with love by zahra🌸</p>
        </div>
    </div>
    <script>
        function showmessage(){
            Document.getElementById("message").style.display="block"
        }
    </script>
</body>
</html>
